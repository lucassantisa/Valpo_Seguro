<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Necesario para que OpenStreetMap acepte cargar los mapas -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>{% block titulo %}Valpo Seguro{% endblock %}</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f2f5f8; color: #222; }
    header { background: #0f2a47; color: white; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 1.2rem; }
    header a { color: white; margin-left: 14px; text-decoration: none; font-weight: bold; }
    main { max-width: 800px; margin: 0 auto; padding: 16px; }
    h2 { font-size: 1.1rem; margin: 18px 0 8px; }
    button, select { font-size: 1rem; padding: 10px; border-radius: 6px; border: 1px solid #999; margin: 4px 4px 4px 0; }
    button { background: #e8eef4; cursor: pointer; }
    button.principal { background: #ff6b5a; color: white; border: none; font-weight: bold; width: 100%; margin-top: 12px; }
    select { width: 100%; box-sizing: border-box; background: white; }
    #mapa { height: 380px; border-radius: 8px; margin-top: 16px; }
    .caja { background: white; border-radius: 8px; padding: 12px 16px; margin-top: 16px; }
    .error { background: #ffe3e0; color: #8a1f11; padding: 10px; border-radius: 6px; margin-top: 12px; }
    .aviso { background: #fff0d6; color: #6b4300; padding: 10px; border-radius: 6px; }
    .bueno { background: #d9f5ef; color: #0b5c52; padding: 10px; border-radius: 6px; }
    .foto { width: 100%; max-width: 360px; border-radius: 8px; margin: 6px 0; }
    .nota { font-size: 0.85rem; color: #555; }
    input[type=text], input[type=password], textarea { width: 100%; box-sizing: border-box; font-size: 1rem; padding: 8px; border: 1px solid #999; border-radius: 6px; }
    textarea { height: 70px; }
    .form-salir { display: inline; }
    .form-salir button { margin: 0 0 0 10px; padding: 4px 10px; font-size: 0.9rem; }
    .resena { border-top: 1px solid #ddd; padding: 8px 0; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <h1>Valpo Seguro</h1>
    <nav>
      <a href="{% url 'mapa' %}">Mapa</a>
      <a href="{% url 'lugares' %}">Lugares</a>
      {% if user.is_authenticated %}
        <span>Hola, {{ user.username }}</span>
        <form method="post" action="{% url 'salir' %}" class="form-salir">
          {% csrf_token %}
          <button type="submit">Salir</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Ingresar</a>
        <a href="{% url 'registro' %}">Crear cuenta</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
